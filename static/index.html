<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0d10"><title>Index Inbox</title><link rel="manifest" href="/manifest.webmanifest?v=29"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css?v=29"></head><body>
<header><div class="brand"><span class="ring">◉</span><h1>Index Inbox</h1><small class="version">v1.2.0</small></div><nav><button id="android-install" hidden>Android app</button><button id="install" hidden>Install PWA</button><button id="menu-toggle" aria-label="Open menu" aria-expanded="false" hidden>☰</button></nav></header>
<nav id="app-menu" class="app-menu" hidden aria-label="App menu"><label class="theme-setting">Appearance<select id="theme-mode"><option value="system">Follow system</option><option value="light">Light</option><option value="dark">Dark</option></select></label><button id="groups-open">Groups</button><button id="activity-open">Recent activity</button><button id="integrations-open">Index Ring</button><button id="status-open">Settings</button><button id="logout">Sign out</button></nav>
<main><section id="signed-out" class="empty"><form id="login-form" class="card login"><h2 id="login-title">Your thoughts, on your server.</h2><p id="setup-help" hidden>Create the first local account using the one-time setup token from your server configuration.</p><input id="setup-token" type="password" autocomplete="off" placeholder="Setup token" hidden><input id="username" autocomplete="username" placeholder="Username" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><input id="password-confirmation" type="password" autocomplete="new-password" placeholder="Confirm password" hidden><button id="login-submit">Sign in</button><button id="login-theme" class="secondary" type="button">Use light mode</button><p id="login-error" class="error"></p></form></section>
<section id="app" hidden>
 <div class="toolbar"><input id="search" type="search" placeholder="Search your inbox"><button id="filter-toggle" aria-expanded="false">☷ Filters</button><button id="capture">＋ Capture</button><button id="refresh" aria-label="Refresh">↻</button></div>
 <div class="filters" id="filter-panel"><label>State<select id="state"><option value="active">Active</option><option value="today">Today</option><option value="reminders">Reminders</option><option value="archived">Archived</option><option value="unprocessed">Unprocessed</option><option value="starred">Starred</option><option value="all">All</option></select></label><label>Category<select id="category"><option value="">All categories</option><option>note</option><option>task</option><option>idea</option><option>question</option></select></label><label>Group<select id="group"><option value="">All groups</option></select></label><button id="filter-clear">Clear filters</button></div>
 <div id="bulk" hidden><b id="selected-count"></b><button data-action="process">Process</button><button data-action="archive">Archive</button><button data-action="restore">Restore</button><button id="bulk-delete">Delete</button></div>
 <div id="entries"></div><div id="empty" class="empty" hidden><h2>No matching entries</h2></div>
 <div class="pager"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div>
</section></main>
<nav id="bottom-nav" hidden aria-label="Primary navigation"><button id="nav-inbox" class="active">⌂<span>Inbox</span></button><button id="nav-capture">＋<span>Capture</span></button><button id="nav-reminders">◷<span>Reminders</span></button></nav>
<dialog id="capture-dialog"><form id="capture-form"><h2>New capture</h2><textarea id="manual-text" rows="6" placeholder="Type a note or record audio…"></textarea><select id="manual-category"><option>note</option><option>task</option><option>idea</option><option>question</option></select><div class="recording-controls"><button type="button" id="record">● Record audio</button><button type="button" id="discard-recording" hidden>Discard audio</button></div><p id="record-status" class="record-status" role="status" aria-live="polite"></p><audio id="record-preview" controls hidden></audio><div class="dialog-actions"><button type="button" data-close>Cancel</button><button id="capture-save">Save</button></div></form></dialog>
<dialog id="info-dialog"><button class="close" data-close>×</button><div id="info"></div></dialog>
<dialog id="confirm-dialog"><form id="confirm-form"><h2 id="confirm-title">Confirm</h2><p id="confirm-message"></p><input id="confirm-input" hidden><div class="dialog-actions"><button type="button" id="confirm-cancel">Cancel</button><button id="confirm-ok">Confirm</button></div></form></dialog>
<template id="entry-template"><article class="card"><div class="meta"><input class="select" type="checkbox"><time></time><span class="category"></span><span class="audio-mark" hidden>♪ audio</span><button class="star">☆</button></div><textarea class="text"></textarea><div class="reminder-fields"><label>Reminder <input class="due-at" type="datetime-local"></label><label>Early alert <input class="notify-before" type="number" min="1" max="10080" placeholder="minutes"> min</label><label><input class="reminder-completed" type="checkbox"> Completed</label></div><audio controls hidden></audio><div class="speed" hidden>Speed <button data-speed="1">1×</button><button data-speed="1.5">1.5×</button><button data-speed="2">2×</button><button class="download">Download</button></div><div class="actions"><input class="tags" placeholder="tags, comma-separated"><select class="group-edit"><option value="">Standalone</option></select><select class="category-edit"><option>note</option><option>task</option><option>idea</option><option>question</option></select><label><input class="processed" type="checkbox"> Processed</label><button class="payload">Payload</button><button class="archive">Archive</button><button class="delete">Delete</button></div></article></template>
<div id="capture-notices" aria-live="polite" aria-atomic="false"></div>
<script src="/config.js?v=29"></script><script type="module" src="/app.js?v=29"></script></body></html>
