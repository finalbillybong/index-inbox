name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/setup-buildx-action@v3

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=index-inbox"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build Android release
        run: ./gradlew :androidApp:testReleaseUnitTest :androidApp:lintRelease :androidApp:assembleRelease

      - name: Read Android version
        id: version
        run: |
          code="$(jq -r '.elements[0].versionCode' androidApp/build/outputs/apk/release/output-metadata.json)"
          name="$(jq -r '.elements[0].versionName' androidApp/build/outputs/apk/release/output-metadata.json)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          mkdir -p .release
          cp androidApp/build/outputs/apk/release/androidApp-release.apk .release/index-inbox.apk
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$name" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Android version $name" >&2
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            ANDROID_UPDATE_VERSION_CODE=${{ steps.version.outputs.code }}
            ANDROID_UPDATE_VERSION_NAME=${{ steps.version.outputs.name }}

      - name: Prepare release assets
        run: |
          cp .release/index-inbox.apk index-inbox-${{ steps.version.outputs.name }}.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            index-inbox-${{ steps.version.outputs.name }}.apk
            compose.yaml
            .env.example
            setup.sh
